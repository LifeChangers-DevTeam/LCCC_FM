<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - LCCC FM</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0a1628 0%, #1e3a5f 50%, #0a1628 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .offline-container {
      text-align: center;
      max-width: 500px;
    }

    .offline-icon {
      font-size: 120px;
      margin-bottom: 30px;
      opacity: 0.3;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      color: #ffffff;
    }

    p {
      font-size: 1.2rem;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 2rem;
    }

    .retry-btn {
      padding: 15px 40px;
      background: linear-gradient(135deg, #860b46, #d91a72);
      border: none;
      border-radius: 30px;
      color: white;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-block;
    }

    .retry-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 40px rgba(134, 11, 70, 0.5);
    }

    .offline-features {
      margin-top: 3rem;
      padding: 2rem;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      backdrop-filter: blur(10px);
    }

    .offline-features h2 {
      font-size: 1.3rem;
      margin-bottom: 1rem;
      color: #FFD100;
    }

    .offline-features ul {
      list-style: none;
      text-align: left;
    }

    .offline-features li {
      padding: 0.5rem 0;
      color: rgba(255, 255, 255, 0.7);
    }

    .offline-features li:before {
      content: "✓ ";
      color: #28a745;
      font-weight: bold;
      margin-right: 10px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .offline-container > * {
      animation: fadeIn 0.6s ease backwards;
    }

    .offline-container > *:nth-child(2) { animation-delay: 0.1s; }
    .offline-container > *:nth-child(3) { animation-delay: 0.2s; }
    .offline-container > *:nth-child(4) { animation-delay: 0.3s; }
    .offline-container > *:nth-child(5) { animation-delay: 0.4s; }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">📡</div>
    <h1>You're Offline</h1>
    <p>
      It looks like you've lost your internet connection. 
      Don't worry, some features are still available!
    </p>
    <button class="retry-btn" onclick="location.reload()">
      Try Again
    </button>

    <div class="offline-features">
      <h2>Available Offline:</h2>
      <ul>
        <li>Browse cached gallery images</li>
        <li>View saved content</li>
        <li>Access app interface</li>
      </ul>
    </div>
  </div>

  <script>
    // Auto-retry when connection is restored
    window.addEventListener('online', () => {
      location.reload();
    });

    // Show connection status
    if (!navigator.onLine) {
      console.log('[Offline] No internet connection');
    }
  </script>
</body>
</html>
