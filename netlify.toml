# =====================================
# NETLIFY CONFIGURATION
# Project: Life Changers Family Radio
# Version: 3.2.0 - Analytics + Security
# =====================================

[build]
  publish = "."
  command = ""

# =====================================
# SECURITY HEADERS (OWASP Best Practices)
# =====================================

[[headers]]
  for = "/*"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=86400"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-DNS-Prefetch-Control = "on"

    Permissions-Policy = """
      accelerometer=(),
      camera=(),
      geolocation=(),
      gyroscope=(),
      magnetometer=(),
      microphone=(),
      payment=(),
      usb=(),
      interest-cohort=()
    """

    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Origin, X-Requested-With, Content-Type, Accept, Authorization"
    Access-Control-Max-Age = "86400"

    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# =====================================
# INDEX PAGE CSP
# =====================================

[[headers]]
  for = "/"
  [headers.values]
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval'
        https://cdnjs.cloudflare.com
        https://cdn.jsdelivr.net
        https://www.youtube.com
        https://s.ytimg.com
        https://www.googletagmanager.com
        https://www.google-analytics.com
        https://ssl.google-analytics.com;
      style-src 'self' 'unsafe-inline'
        https://fonts.googleapis.com
        https://cdn.jsdelivr.net
        https://cdnjs.cloudflare.com;
      img-src 'self' data: blob: https:;
      media-src 'self' blob:
        https://*.shoutcast.com
        https://*.shoutcheap.com
        https://broadcast.shoutcheap.com;
      font-src 'self' data:
        https://fonts.gstatic.com
        https://cdnjs.cloudflare.com;
      connect-src 'self'
        https://api.allorigins.win
        https://api.codetabs.com
        https://www.youtube.com
        https://www.googleapis.com
        https://graph.facebook.com
        https://*.fbcdn.net
        https://broadcast.shoutcheap.com
        https://*.shoutcheap.com
        https://www.google-analytics.com
        https://region1.google-analytics.com
        https://analytics.google.com
        https://www.googletagmanager.com;
      frame-src 'self'
        https://www.youtube.com
        https://www.youtube-nocookie.com;
      worker-src 'self' blob:;
      manifest-src 'self';
      base-uri 'self';
      form-action 'self';
      frame-ancestors 'self';
      upgrade-insecure-requests;
    """

# =====================================
# HTML PAGES CSP (covers all .html files)
# =====================================

[[headers]]
  for = "/*.html"
  [headers.values]
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval'
        https://cdnjs.cloudflare.com
        https://cdn.jsdelivr.net
        https://www.youtube.com
        https://s.ytimg.com
        https://www.googletagmanager.com
        https://www.google-analytics.com
        https://ssl.google-analytics.com;
      style-src 'self' 'unsafe-inline'
        https://fonts.googleapis.com
        https://cdn.jsdelivr.net
        https://cdnjs.cloudflare.com;
      img-src 'self' data: blob: https:;
      media-src 'self' blob:
        https://*.shoutcast.com
        https://*.shoutcheap.com
        https://broadcast.shoutcheap.com;
      font-src 'self' data:
        https://fonts.gstatic.com
        https://cdnjs.cloudflare.com;
      connect-src 'self'
        https://api.allorigins.win
        https://api.codetabs.com
        https://www.youtube.com
        https://www.googleapis.com
        https://graph.facebook.com
        https://*.fbcdn.net
        https://broadcast.shoutcheap.com
        https://*.shoutcheap.com
        https://www.google-analytics.com
        https://region1.google-analytics.com
        https://analytics.google.com
        https://www.googletagmanager.com;
      frame-src 'self'
        https://www.youtube.com
        https://www.youtube-nocookie.com;
      worker-src 'self' blob:;
      manifest-src 'self';
      base-uri 'self';
      form-action 'self';
      frame-ancestors 'self';
      upgrade-insecure-requests;
    """
    Cache-Control = "public, max-age=300, must-revalidate"
    Content-Type = "text/html; charset=utf-8"
    X-Robots-Tag = "index, follow"

# =====================================
# GALLERY PAGE CSP
# =====================================

[[headers]]
  for = "/gallery.html"
  [headers.values]
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline'
        https://cdn.jsdelivr.net
        https://cdnjs.cloudflare.com
        https://www.googletagmanager.com
        https://www.google-analytics.com;
      style-src 'self' 'unsafe-inline'
        https://fonts.googleapis.com
        https://cdnjs.cloudflare.com;
      img-src 'self' data: blob: https:;
      connect-src 'self'
        https://graph.facebook.com
        https://*.fbcdn.net
        https://www.google-analytics.com
        https://region1.google-analytics.com
        https://analytics.google.com
        https://www.googletagmanager.com;
      font-src 'self'
        https://fonts.gstatic.com;
      worker-src 'self' blob:;
      upgrade-insecure-requests;
    """

# =====================================
# SERVICE WORKER - NEVER CACHE
# =====================================

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"
    Content-Type = "application/javascript; charset=utf-8"
    Service-Worker-Allowed = "/"

# =====================================
# MANIFEST - PWA
# =====================================

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
    Content-Type = "application/manifest+json; charset=utf-8"
    Access-Control-Allow-Origin = "*"

# =====================================
# STATIC ASSETS - AGGRESSIVE CACHING
# =====================================

[[headers]]
  for = "/js/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/css/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "text/css; charset=utf-8"

[[headers]]
  for = "/resources/*.{jpg,jpeg,png,gif,webp,svg,ico,avif}"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/*.{mp3,aac,ogg,wav}"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Access-Control-Allow-Origin = "*"
    Content-Type = "audio/mpeg"

[[headers]]
  for = "/fonts/*.{woff,woff2,ttf,eot,otf}"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# =====================================
# SECURITY.TXT
# =====================================

[[headers]]
  for = "/.well-known/security.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400"

# =====================================
# REDIRECTS & REWRITES
# =====================================

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
  
[[redirects]]
  from = "/404"
  to = "/index.html"
  status = 404

# =====================================
# BUILD PROCESSING
# =====================================

[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true

# =====================================
# ENVIRONMENT VARIABLES
# =====================================

[context.production.environment]
  NODE_ENV = "production"
  FACEBOOK_PAGE_ID = "100079670415708"

[context.deploy-preview.environment]
  NODE_ENV = "development"

[context.branch-deploy.environment]
  NODE_ENV = "staging"

# =====================================
# FUNCTIONS
# =====================================

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["data/**"]

