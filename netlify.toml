# =====================================
# NOTES
# =====================================

# Security Checklist:
# ✅ HTTPS enforced (Strict-Transport-Security)
# ✅ XSS protection (X-XSS-Protection, CSP)
# ✅ Clickjacking protection (X-Frame-Options)
# ✅ MIME sniffing blocked (X-Content-Type-Options)
# ✅ Referrer policy configured
# ✅ Permissions policy (disabled unnecessary features)
# ✅ Content Security Policy (strict)
# ✅ CORS properly configured
# ✅ Service Worker never cached
# ✅ Aggressive static asset caching
# ✅ Upgrade insecure requests
# ✅ DNS prefetch control
# ✅ Google Analytics / GTM allowed (v3.2.0)
# ✅ Analytics domains in connect-src AND script-src
# ✅ HTML pages now share consistent CSP via /*.html rule
